name: Daily NSE/BSE EOD Price Sync

on:
  schedule:
    # 10:45 UTC = 4:15 PM IST (Monday to Friday, 45 mins after NSE market close)
    - cron: '45 10 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  sync-eod-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Firestore EOD Sync Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/eod_sync.py